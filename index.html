<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFFFF">
<title>for us ❤</title>

<!-- 
  FONT: "Fredoka" — this is the cute/round/bubbly one (not romantic-script).
  If you want to try alternatives later: "Baloo 2" and "Comfortaa" are also
  cute+round. Just swap the family name below and in the CSS font-family.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Baloo+2:wght@400;500;600;700&family=Comfortaa:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<!-- ---- Entry overlay ----
     Full-screen blurred veil shown the instant the page loads, before
     anything else is reachable. Tapping the button is a real, unambiguous
     user gesture — so it's used to start the music with total certainty
     (no autoplay-policy guesswork needed) in the same instant it fades
     the blur away to reveal the envelope underneath. -->
<div id="entry-overlay">
  <button id="entry-btn" aria-label="Tap to enter">
    <img class="entry-heart" src="assets/images/decoration-1.png" alt="">
    <span>tap to enter</span>
  </button>
</div>

<!-- Fixed full-screen layer for the tap-burst hearts/petals. Sits above
     everything so particles fly out over the text/buttons; pointer-events
     none so it never blocks taps underneath. -->
<div id="particle-layer" aria-hidden="true"></div>

<!-- 
  Reusable flower "sprites" drawn as SVG, referenced below with <use>.
  This is instead of PNGs — see note in chat. Colors pull from the
  CSS variables above via var(--pink) etc, so they auto-match your palette.
-->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="s-lily" viewBox="0 0 64 64">
      <g stroke-linecap="round" stroke-linejoin="round">
        <!-- 6 curled-back stargazer petals, white edge / hot pink center -->
        <path d="M32 34 C 32 34 14 26 8 12 C 6 6 12 4 18 10 C 26 18 32 34 32 34 Z" fill="#F9D8E6" stroke="#E85D97" stroke-width="1.2"/>
        <path d="M32 34 C 32 34 50 26 56 12 C 58 6 52 4 46 10 C 38 18 32 34 32 34 Z" fill="#F9D8E6" stroke="#E85D97" stroke-width="1.2"/>
        <path d="M32 34 C 32 34 20 20 20 8 C 20 2 26 2 28 8 C 31 16 32 34 32 34 Z" fill="#FBE6EF" stroke="#E85D97" stroke-width="1.2"/>
        <path d="M32 34 C 32 34 44 20 44 8 C 44 2 38 2 36 8 C 33 16 32 34 32 34 Z" fill="#FBE6EF" stroke="#E85D97" stroke-width="1.2"/>
        <path d="M32 34 C 32 34 16 40 10 52 C 7 58 13 61 18 56 C 26 48 32 34 32 34 Z" fill="#F6C4DA" stroke="#E85D97" stroke-width="1.2"/>
        <path d="M32 34 C 32 34 48 40 54 52 C 57 58 51 61 46 56 C 38 48 32 34 32 34 Z" fill="#F6C4DA" stroke="#E85D97" stroke-width="1.2"/>
        <!-- speckles -->
        <g fill="#C23B72">
          <circle cx="24" cy="18" r="0.8"/><circle cx="27" cy="14" r="0.7"/><circle cx="20" cy="24" r="0.7"/>
          <circle cx="40" cy="18" r="0.8"/><circle cx="37" cy="14" r="0.7"/><circle cx="44" cy="24" r="0.7"/>
          <circle cx="22" cy="42" r="0.8"/><circle cx="18" cy="47" r="0.7"/>
          <circle cx="42" cy="42" r="0.8"/><circle cx="46" cy="47" r="0.7"/>
        </g>
        <!-- stamens -->
        <g stroke="#8FAE4E" stroke-width="1" fill="none">
          <path d="M32 34 L 26 22"/><path d="M32 34 L 30 20"/><path d="M32 34 L 34 20"/><path d="M32 34 L 38 22"/>
        </g>
        <g fill="#D97706">
          <ellipse cx="26" cy="21" rx="1.6" ry="2.6" transform="rotate(-25 26 21)"/>
          <ellipse cx="30" cy="19" rx="1.6" ry="2.6" transform="rotate(-8 30 19)"/>
          <ellipse cx="34" cy="19" rx="1.6" ry="2.6" transform="rotate(8 34 19)"/>
          <ellipse cx="38" cy="21" rx="1.6" ry="2.6" transform="rotate(25 38 21)"/>
        </g>
      </g>
    </symbol>

    <symbol id="s-rose" viewBox="0 0 64 64">
      <g stroke-linecap="round" stroke-linejoin="round">
        <!-- outer pink petals -->
        <path d="M32 40 C 16 40 12 26 20 19 C 25 15 32 18 32 26 C 32 18 39 15 44 19 C 52 26 48 40 32 40 Z" fill="#F2A6C6" stroke="#D6699A" stroke-width="1.2"/>
        <!-- mid swirl -->
        <path d="M32 34 C 24 34 21 27 25 23 C 28 20 32 23 32 27 C 32 23 36 20 39 23 C 43 27 40 34 32 34 Z" fill="#F7C1D8" stroke="#D6699A" stroke-width="1"/>
        <!-- inner bud swirl -->
        <path d="M32 30 C 28 30 27 26 29 24 C 30 23 32 24 32 26 C 32 24 34 23 35 24 C 37 26 36 30 32 30 Z" fill="#FBDCEA" stroke="#D6699A" stroke-width="0.8"/>
        <!-- stem + leaves -->
        <path d="M32 40 L 32 58" fill="none" stroke="#4C7A4E" stroke-width="2"/>
        <path d="M32 48 C 25 48 21 44 21 44" fill="none" stroke="#4C7A4E" stroke-width="2"/>
        <path d="M32 52 C 39 52 43 47 43 47" fill="none" stroke="#4C7A4E" stroke-width="2"/>
      </g>
    </symbol>

    <symbol id="s-snap" viewBox="0 0 64 64">
      <g fill="none" stroke="#D6839F" stroke-width="2" stroke-linecap="round">
        <path d="M32 6 L 32 58"/>
        <ellipse cx="25" cy="16" rx="6" ry="4" transform="rotate(-22 25 16)" fill="#FBE0EC"/>
        <ellipse cx="39" cy="16" rx="6" ry="4" transform="rotate(22 39 16)" fill="#FBE0EC"/>
        <ellipse cx="25" cy="27" rx="6.5" ry="4.2" transform="rotate(-18 25 27)" fill="#FBE0EC"/>
        <ellipse cx="39" cy="27" rx="6.5" ry="4.2" transform="rotate(18 39 27)" fill="#FBE0EC"/>
        <ellipse cx="26" cy="38" rx="7" ry="4.4" transform="rotate(-16 26 38)" fill="#FBE0EC"/>
        <ellipse cx="38" cy="38" rx="7" ry="4.4" transform="rotate(16 38 38)" fill="#FBE0EC"/>
      </g>
    </symbol>

    <symbol id="s-fmn" viewBox="0 0 64 64">
      <g stroke-width="1.6" stroke-linecap="round">
        <path d="M32 26 L 24 46 M32 26 L 32 48 M32 26 L 40 46" fill="none" stroke="#5B8A3A"/>
        <!-- 5-petal pink flowers with yellow-white centers -->
        <g>
          <g transform="translate(20,20)">
            <circle r="5" fill="#F2A6C6" stroke="#D6699A"/>
            <circle r="2" fill="#FFFFFF" stroke="none"/>
            <circle r="1" fill="#F2C230" stroke="none"/>
          </g>
          <g transform="translate(32,13)">
            <circle r="5" fill="#F2A6C6" stroke="#D6699A"/>
            <circle r="2" fill="#FFFFFF" stroke="none"/>
            <circle r="1" fill="#F2C230" stroke="none"/>
          </g>
          <g transform="translate(44,20)">
            <circle r="5" fill="#F2A6C6" stroke="#D6699A"/>
            <circle r="2" fill="#FFFFFF" stroke="none"/>
            <circle r="1" fill="#F2C230" stroke="none"/>
          </g>
        </g>
      </g>
    </symbol>
    <symbol id="s-heart" viewBox="0 0 64 64">
      <path d="M32 56 C 12 42 4 30 4 18 C 4 8 12 2 20 2 C 26 2 30 6 32 10 C 34 6 38 2 44 2 C 52 2 60 8 60 18 C 60 30 52 42 32 56 Z" fill="currentColor"/>
    </symbol>

    <!-- Simple petal shape — a soft teardrop, used for the tap-burst
         particles alongside hearts. -->
    <symbol id="s-petal" viewBox="0 0 64 64">
      <path d="M32 4 C 46 16 52 30 44 44 C 40 52 24 52 20 44 C 12 30 18 16 32 4 Z" fill="currentColor"/>
    </symbol>

    <!-- Pink tulip — for txlips. A single flower-head silhouette with a
         wavy three-lobed top (left / center / right bumps), the classic
         tulip crown shape, rounding into the base where the stem meets it. -->
    <symbol id="s-tulip" viewBox="0 0 64 64">
      <g stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 58 L 32 41" fill="none" stroke="#5B8A3A" stroke-width="2.4"/>
        <path d="M32 47 C 24 47 19 42 19 42 C 19 49 25 52 32 51" fill="#5B8A3A" stroke="#4C7A4E" stroke-width="1"/>

        <!-- flower head: left bump / center bump / right bump, rounding into one cup -->
        <path d="M20 26 C 19 20 21 15 24 14 C 26 17 27 19 28 20 C 29 16 30 12 32 10 C 34 12 35 16 36 20 C 37 19 38 17 40 14 C 43 15 45 20 44 26 C 43 34 38 40 32 41 C 26 40 21 34 20 26 Z" fill="#F2A6C6" stroke="#D6699A" stroke-width="1.2"/>

        <!-- petal fold lines separating the three lobes -->
        <path d="M28 38 C 27 31 27 25 28 20" fill="none" stroke="#C7548A" stroke-width="1"/>
        <path d="M36 38 C 37 31 37 25 36 20" fill="none" stroke="#C7548A" stroke-width="1"/>

        <!-- soft highlight on the front of the cup -->
        <path d="M25 24 C 24 29 25 35 28 39" fill="none" stroke="#FBE6EF" stroke-width="1.4" opacity="0.8"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- Music cluster: fixed top-right — hint text, song picker, sound toggle -->
<div id="music-cluster">
  <span id="song-hint">you can change the song here 💕</span>

  <div id="song-picker-wrap">
    <div id="song-label-anchor">
      <button id="song-label" aria-haspopup="true" aria-expanded="false">
        <svg class="note" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M9 18V5l11-2v11" fill="none" stroke="#D6699A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.6" fill="#D6699A"/>
          <circle cx="17.5" cy="16" r="2.6" fill="#D6699A"/>
        </svg>
        <span class="song-title-text" id="song-title-text"><span class="title-inner">Loading…</span></span>
      </button>
      <div id="song-menu" role="menu"></div>
    </div>
    <div id="song-controls-row">
      <button id="play-pause-toggle" aria-label="Pause">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <polygon class="icon-play" points="6,4 20,12 6,20" fill="#D6699A"/>
          <g class="icon-pause">
            <rect x="5" y="4" width="4.5" height="16" rx="1.5" fill="#D6699A"/>
            <rect x="14.5" y="4" width="4.5" height="16" rx="1.5" fill="#D6699A"/>
          </g>
        </svg>
      </button>
      <div id="song-progress-row">
        <span id="song-time-elapsed">0:00</span>
        <div id="song-progress-track">
          <div id="song-progress-fill"></div>
        </div>
        <span id="song-time-total">0:00</span>
      </div>
    </div>
  </div>

  <div id="volume-control">
    <button id="sound-toggle" aria-label="Adjust volume" aria-pressed="false" aria-expanded="false">
      <span class="icon-spin">
        <svg viewBox="0 0 24 24" fill="none">
          <polygon points="3,9 8,9 13,4 13,20 8,15 3,15" fill="#D6699A"/>
          <path class="wave wave1" d="M16.5 9a5 5 0 0 1 0 6" stroke="#D6699A" stroke-width="2" stroke-linecap="round"/>
          <path class="wave wave2" d="M19.5 6a9 9 0 0 1 0 12" stroke="#D6699A" stroke-width="2" stroke-linecap="round"/>
          <line class="mute-x mute-x1" x1="16" y1="9" x2="22" y2="15" stroke="#D6699A" stroke-width="2" stroke-linecap="round"/>
          <line class="mute-x mute-x2" x1="22" y1="9" x2="16" y2="15" stroke="#D6699A" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
    </button>
    <div id="volume-slider">
      <div id="volume-slider-track">
        <div id="volume-slider-fill"></div>
        <div id="volume-slider-thumb" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="28"></div>
      </div>
    </div>
  </div>
</div>

<audio id="bg-music" preload="auto" autoplay muted playsinline></audio>


<script src="js/playlist-data.js"></script>



<div id="stage">

  <button id="envelope" aria-label="Open your letter">
    <div class="tulip-reveal">
      <svg class="tulip-item t-left" viewBox="0 0 64 64"><use href="#s-tulip"/></svg>
      <svg class="tulip-item t-center" viewBox="0 0 64 64"><use href="#s-tulip"/></svg>
      <svg class="tulip-item t-right" viewBox="0 0 64 64"><use href="#s-tulip"/></svg>
    </div>
    <div class="env-flap"></div>
    <div class="env-body"></div>
    <div class="env-stamp"><div class="env-stamp-heart"></div></div>
  <div class="bunny-stack">
    <img alt="" src="assets/images/decoration-1.png">
    <img alt="" src="assets/images/decoration-2.png">
    <img alt="" src="assets/images/decoration-3.png">
    <img alt="" src="assets/images/decoration-4.png">
  </div>
    <div class="env-caption">
      <div class="env-text">for Dena <svg width="0.55em" height="0.55em" viewBox="0 0 64 64" style="fill:#D6699A; vertical-align:-0.12em;"><use href="#s-heart"/></svg></div>
      <div class="env-subtitle">my pretty pink tulip</div>
    </div>
    <div class="env-sub">tap to open</div>
  </button>

</div>
